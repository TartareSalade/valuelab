[project]
name = "valuelab"
version = "0.1.0"
description = "Analysis stock market"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standar]",
  "yfinance",
  "pandas",
  "numpy",
]

[dependency-groups]
dev = [
  "pytest",
  "httpx",
  "ruff",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "backend"
